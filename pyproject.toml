[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wp-local"
version = "1.0.0"
description = "CLI harness for Local by Flywheel — manage WordPress sites headlessly"
readme = "wp_local/local/README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "requests>=2.25",
]

[project.scripts]
wp-local = "wp_local.local.local_cli:cli"

[tool.setuptools.packages.find]
include = ["wp_local.*"]

[tool.setuptools.package-data]
"wp_local.local" = ["skills/*.md"]
